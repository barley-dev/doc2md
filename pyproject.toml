[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2md"
version = "0.8.0"
description = "Universal document to Markdown converter (PDF, DOCX, PPTX, XLSX, and more)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["markdown", "converter", "pdf", "docx", "pptx", "xlsx", "document"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "pymupdf>=1.24.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "markdownify>=0.13.0",
]

[project.scripts]
doc2md = "doc2md:main"

[project.urls]
Homepage = "https://github.com/{{GITHUB_USERNAME}}/doc2md"
"Bug Tracker" = "https://github.com/{{GITHUB_USERNAME}}/doc2md/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["converters*", "utils*"]

[tool.setuptools.package-data]
"*" = ["config.json"]
