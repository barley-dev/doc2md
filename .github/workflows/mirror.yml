name: Mirror to YRC-Lab

# Pushes every commit on main to the YRC-Lab mirror, so students can pull
# from the organisation while this repository stays the single source of truth.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "MIRROR_TOKEN is not set — skipping mirror."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          git push --force \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/YRC-Lab/doc2md.git" \
            HEAD:main
          echo "Mirrored to YRC-Lab/doc2md"
